# ═══════════════════════════════════════════════════════════════
# RCA Agent — Application Configuration
# Copy this file, set ANTHROPIC_API_KEY env var, then run.
# ═══════════════════════════════════════════════════════════════

spring.application.name=rca-agent
server.port=8080

# ─── Anthropic Claude API ──────────────────────────────────────
# Set via environment variable: export ANTHROPIC_API_KEY=sk-ant-...
agent.core.anthropic.api-key=${ANTHROPIC_API_KEY:llm-api-key}
agent.core.anthropic.default-model=claude-sonnet-4-5
agent.core.anthropic.default-max-tokens=8192

# ─── Orchestration ─────────────────────────────────────────────
agent.core.orchestration.strategy=parallel
agent.core.orchestration.agent-timeout=5m

# ─── Retry ─────────────────────────────────────────────────────
agent.core.retry.max-attempts=3
agent.core.retry.base-delay-ms=2000

# ─── Security (file-read path jails) ───────────────────────────
agent.core.security.log-base-path=/temp/logs
agent.core.security.code-base-path=/

# ─── RCA: Codebase configuration ───────────────────────────────
# Options: local | github
rca.codebase.type=local
rca.codebase.local-base-path=/temp/IDEA/trajor

# GitHub (only if rca.codebase.type=github)
# rca.codebase.github-repo=your-org/your-repo
# rca.codebase.github-branch=main
# rca.codebase.github-token=${GITHUB_TOKEN}

# ─── RCA: Log configuration ────────────────────────────────────
rca.log.max-lines=5000
rca.log.base-path=/temp/log

# ─── RCA: Phase 1 cache ────────────────────────────────────────
# Phase 1 findings (log + code + git analysis) are cached per unique
# logLocation+codebase combination. Set to 0 to disable caching.
rca.cache.phase1-ttl-minutes=10

# ─── CLI mode ──────────────────────────────────────────────────
# To run in CLI mode, set these properties:
# rca.cli.enabled=true
# rca.cli.log-location=relative/path/to/app.log
# rca.cli.codebase-type=local
# rca.cli.codebase-location=/path/to/your/project

# ─── Actuator ──────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ─── Logging ───────────────────────────────────────────────────
# INFO  — agent lifecycle (started, completed, failed)
# DEBUG — LLM request params, tool call names+inputs, tool results, token usage, iteration counts
# TRACE — full user messages, system prompts, raw LLM responses (very verbose)
logging.level.com.binarray.binarix=DEBUG
logging.level.com.binarray.binarix.core.impl.anthropic.AnthropicGateway=TRACE
logging.level.com.anthropic=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n

# Uncomment to enable full LLM message tracing (system prompts, user messages, raw responses):
# logging.level.com.binarray.binarix.core.impl.anthropic.AnthropicGateway=TRACE
# logging.level.com.binarray.binarix.core.impl.agent=TRACE
